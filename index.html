<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>급식 알림</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      background: white;
      width: 90%;
      max-width: 400px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .box {
      margin: 15px 0;
      padding: 15px;
      border-radius: 12px;
      background: #f5f5f5;
    }

    .title {
      font-size: 14px;
      color: gray;
    }

    .value {
      font-size: 24px;
      font-weight: bold;
      color: #4facfe;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
    }

    button {
      background: #4facfe;
      color: white;
      cursor: pointer;
    }

    .complete-btn {
      background: #28a745;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<div class="app">
  <h1>🍽 급식 순서</h1>

  <!-- 현재 식사 -->
  <div class="box">
    <div class="title">현재 식사 중</div>
    <div class="value" id="current">없음</div>
  </div>

  <!-- 다음 순서 -->
  <div class="box">
    <div class="title">다음 급식 순서</div>
    <div class="value" id="next">미정</div>
  </div>

  <!-- 선택 -->
  <select id="grade">
    <option value="">학년 선택</option>
    <option value="1">1학년</option>
    <option value="2">2학년</option>
    <option value="3">3학년</option>
  </select>

  <select id="classNum">
    <option value="">반 선택</option>
  </select>

  <button onclick="setNext()">다음 반 설정</button>

  <button class="complete-btn" onclick="completeMeal()">식사 완료</button>
</div>

<script>
  const gradeSelect = document.getElementById("grade");
  const classSelect = document.getElementById("classNum");

  // 학년 선택 → 반 생성
  gradeSelect.addEventListener("change", function() {
    const grade = this.value;
    classSelect.innerHTML = '<option value="">반 선택</option>';

    let maxClass = 0;
    if (grade == "1") maxClass = 11;
    else if (grade == "2") maxClass = 8;
    else if (grade == "3") maxClass = 8;

    for (let i = 1; i <= maxClass; i++) {
      let option = document.createElement("option");
      option.value = i;
      option.text = i + "반";
      classSelect.appendChild(option);
    }
  });

  // 다음 반 설정
  function setNext() {
    const grade = gradeSelect.value;
    const classNum = classSelect.value;

    if (!grade || !classNum) {
      alert("학년과 반을 선택하세요!");
      return;
    }

    const text = grade + "학년 " + classNum + "반";
    document.getElementById("next").innerText = text;
    localStorage.setItem("next", text);
  }

  // 식사 완료 → 다음 반 이동
  function completeMeal() {
    const next = localStorage.getItem("next");

    if (!next) {
      alert("다음 반이 설정되지 않았습니다!");
      return;
    }

    document.getElementById("current").innerText = next;
    document.getElementById("next").innerText = "미정";

    localStorage.setItem("current", next);
    localStorage.removeItem("next");
  }

  // 저장된 값 불러오기
  const savedCurrent = localStorage.getItem("current");
  const savedNext = localStorage.getItem("next");

  if (savedCurrent) {
    document.getElementById("current").innerText = savedCurrent;
  }

  if (savedNext) {
    document.getElementById("next").innerText = savedNext;
  }
</script>

</body>
</html>
